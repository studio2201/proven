name: 'Proven Supply-Chain Attestor'
description: 'Generates byte-identity hashes and SLSA attestations'
author: 'studio2201'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Target binary or artifact path to attest'
    required: true
  output:
    description: 'Output attestation destination'
    required: false
    default: 'attestation.json'

runs:
  using: 'composite'
  steps:
    - name: Fast Bootstrap proven
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v proven >/dev/null 2>&1; then
          if [ -f "${{ github.action_path }}/../install.sh" ]; then
            sh "${{ github.action_path }}/../install.sh" --dest "$DEST" proven
          elif [ -f "${{ github.action_path }}/install.sh" ]; then
            sh "${{ github.action_path }}/install.sh" --dest "$DEST" proven
          else
            curl -fsSL --retry 3 https://studio2201.com/install.sh | sh -s -- --dest "$DEST" proven
          fi
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Proven Attest & Verify
      shell: bash
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        set +e
        proven sign "${{ inputs.path }}" -f json -o "${{ inputs.output }}" > proven_summary.md 2>&1 || \
          proven sign "${{ inputs.path }}" --format json -o "${{ inputs.output }}" > proven_summary.md 2>&1
        EC=$?
        proven verify "${{ inputs.path }}" --attestation "${{ inputs.output }}" >> proven_summary.md 2>&1
        VEC=$?
        set -e

        [ $VEC -ne 0 ] && EC=$VEC
        STATUS="🟢 ATTESTED"
        BADGE="https://img.shields.io/badge/Proven-ATTESTED-brightgreen"
        if [ $EC -ne 0 ]; then
          STATUS="🔴 VERIFICATION FAILED"
          BADGE="https://img.shields.io/badge/Proven-FAILED-red"
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "## 🔏 Proven Supply-Chain Attestation"
            echo ""
            echo "| Status | Algorithm | Standard | Badge |"
            echo "| :---: | :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`ML-DSA-65\` | \`SLSA Level 3+\` | ![Proven](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat proven_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
