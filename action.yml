name: 'Proven Supply-Chain Attestor'
description: 'Generates byte-identity hashes and SLSA attestations'
author: 'studio2201'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Target binary or artifact path to attest'
    required: true
  output:
    description: 'Output attestation destination'
    required: false
    default: 'attestation.json'

runs:
  using: 'composite'
  steps:
    - name: Bootstrap proven (pinned v0.2.12 + SHA-256)
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v proven >/dev/null 2>&1; then
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) TARGET="x86_64-unknown-linux-musl" ;;
            Darwin-arm64|Darwin-aarch64) TARGET="aarch64-apple-darwin" ;;
            *) echo "::error::Unsupported runner platform $(uname -s)-$(uname -m) (supported: Linux x86_64, macOS arm64)"; exit 1 ;;
          esac
          ASSET="proven-${TARGET}.tar.gz"
          URL="https://github.com/studio2201/proven/releases/download/v0.2.12/${ASSET}"
          curl -fsSL --retry 3 "$URL" -o "$TMP/$ASSET"
          curl -fsSL --retry 3 "${URL}.sha256" -o "$TMP/${ASSET}.sha256"
          EXPECTED=$(awk '{print $1}' "$TMP/${ASSET}.sha256")
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid SHA-256 for $ASSET"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | sha256sum --strict --check -)
          else
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | shasum -a 256 --check -)
          fi
          tar -xzf "$TMP/$ASSET" -C "$DEST" proven && chmod 755 "$DEST/proven"
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Proven Attest & Verify
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        set +e
        proven sign "$INPUT_PATH" -f json -o "$INPUT_OUTPUT" > proven_summary.md 2>&1 || \
          proven sign "$INPUT_PATH" --format json -o "$INPUT_OUTPUT" > proven_summary.md 2>&1
        EC=$?
        proven verify "$INPUT_PATH" --attestation "$INPUT_OUTPUT" >> proven_summary.md 2>&1
        VEC=$?
        set -e

        [ $VEC -ne 0 ] && EC=$VEC
        STATUS="🟢 ATTESTED"
        BADGE="https://img.shields.io/badge/Proven-ATTESTED-brightgreen"
        if [ $EC -ne 0 ]; then
          STATUS="🔴 VERIFICATION FAILED"
          BADGE="https://img.shields.io/badge/Proven-FAILED-red"
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## 🔏 Proven Supply-Chain Attestation"
            echo ""
            echo "| Status | Algorithm | Standard | Badge |"
            echo "| :---: | :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`HMAC-SHA256\` | \`in-toto v1\` | ![Proven](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat proven_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
